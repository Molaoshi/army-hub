name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bridge-and-manager:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: bridge:manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r manager/requirements.txt matrix-nio pytest-asyncio
      - name: Test clean checkout without runtime credentials
        run: python -m pytest -p no:cacheprovider manager/tests bridge/tests
