[unix_http_server]
file=/home/box/army-hub/.runtime/grok-supervisord.sock
chmod=0700

[supervisord]
logfile=/home/box/army-hub/.runtime/grok-supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/home/box/army-hub/.runtime/grok-supervisord.pid
childlogdir=/home/box/army-hub/.runtime
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/box/army-hub/.runtime/grok-supervisord.sock

[program:tailscaled]
command=/usr/bin/sudo -n /usr/sbin/tailscaled --statedir=/var/lib/tailscale --socket=/var/run/tailscale/tailscaled.sock
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/home/box/army-hub/.runtime/tailscaled.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:army-grok]
command=/home/box/army-hub/.venv-service/bin/python -m army_grok_gateway --config /home/box/army-hub/.runtime/grok-gateway.yaml
directory=/home/box/army-hub/bridge
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/home/box/army-hub/.runtime/grok-gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
