name: army-hub

services:
  postgres:
    image: postgres:16-alpine
    container_name: army-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - ./.runtime/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 20

  synapse:
    image: matrixdotorg/synapse:v1.161.0
    container_name: army-synapse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.runtime/synapse:/data
    ports:
      - "127.0.0.1:8010:8008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/_matrix/client/versions')"]
      interval: 10s
      timeout: 5s
      retries: 20

  element:
    image: vectorim/element-web:v1.12.28
    container_name: army-element
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ./config/element-config.json:/app/config.json:ro
    ports:
      - "127.0.0.1:3103:80"

  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    container_name: army-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ARMY_BACKUP_IN_DOCKER: "1"
      TZ: UTC
    volumes:
      - ./:/army
    command:
      - /bin/sh
      - -c
      - echo '17 19 * * * /army/scripts/backup.sh >> /army/.runtime/backup.log 2>&1' > /etc/crontabs/root && exec crond -f -l 2
